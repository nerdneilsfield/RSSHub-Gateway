# EN: server settings
# 中文: 服务设置
server:
  # EN: listen address
  # 中文: 监听地址
  listen: ":8080"
  # EN: request timeout in milliseconds
  # 中文: 请求超时（毫秒）
  timeout_ms: 8000

# EN: gateway authentication
# 中文: 网关鉴权
gateway_auth:
  # EN: enable gateway auth
  # 中文: 是否启用网关鉴权
  enabled: true
  # EN: global access key
  # 中文: 全局访问密钥
  access_key: "ILoveRSSHub"
  # EN: accept ?key= style
  # 中文: 支持 ?key= 方式
  accept_key: true
  # EN: accept ?code=md5(path+key)
  # 中文: 支持 ?code=md5(path+key)
  accept_code: true
  # EN: gateway auth bypass paths (no key needed)
  # 中文: 网关鉴权白名单路径（无需 key）
  bypass_paths:
    - "/favicon.ico"
    - "/logo.png"
    - "/robots.txt"
    - "/manifest.json"

# EN: Prometheus metrics
# 中文: Prometheus 指标
metrics:
  # EN: enable metrics
  # 中文: 是否启用指标
  enabled: true
  # EN: metrics path
  # 中文: 指标路径
  path: "/metrics"
  # EN: query key for metrics access
  # 中文: 指标访问密钥（query）
  accesskey: "PROM_KEY_123"

# EN: pprof debug endpoints
# 中文: pprof 调试端点
pprof:
  # EN: enable pprof
  # 中文: 是否启用 pprof
  enabled: false
  # EN: pprof path
  # 中文: pprof 路径
  path: "/debug/pprof"
  # EN: query key for pprof access
  # 中文: pprof 访问密钥（query）
  accesskey: "PPROF_KEY_123"

# EN: response cache
# 中文: 响应缓存
cache:
  # EN: enable cache
  # 中文: 是否启用缓存
  enabled: false
  # EN: provider (memory or redis)
  # 中文: 缓存类型（memory 或 redis）
  provider: "memory"
  # EN: cache TTL in milliseconds
  # 中文: 缓存 TTL（毫秒）
  ttl_ms: 3600000
  # EN: max response size to cache (bytes)
  # 中文: 单条响应最大缓存大小（字节）
  max_item_bytes: 2097152
  # EN: max total cache size (bytes, memory only)
  # 中文: 内存缓存最大总大小（字节）
  max_total_bytes: 52428800
  redis:
    # EN: Redis address
    # 中文: Redis 地址
    addr: "127.0.0.1:6379"
    # EN: Redis password (optional)
    # 中文: Redis 密码（可选）
    password: ""
    # EN: Redis DB index
    # 中文: Redis DB 索引
    db: 0
    # EN: dial timeout in milliseconds
    # 中文: 连接超时（毫秒）
    dial_timeout_ms: 1000
    # EN: read timeout in milliseconds
    # 中文: 读取超时（毫秒）
    read_timeout_ms: 1000
    # EN: write timeout in milliseconds
    # 中文: 写入超时（毫秒）
    write_timeout_ms: 1000
    # EN: key prefix
    # 中文: key 前缀
    key_prefix: "rsshub_gateway"

# EN: reload settings
# 中文: 重载设置
reload:
  auto:
    # EN: enable auto reload polling
    # 中文: 是否启用自动轮询重载
    enabled: false
    # EN: polling interval in milliseconds
    # 中文: 轮询间隔（毫秒）
    interval_ms: 30000

# EN: short subscription redirects
# 中文: 订阅缩写跳转
short:
  # EN: enable short redirects
  # 中文: 是否启用 short
  enabled: false
  # EN: short path prefix
  # 中文: short 前缀路径
  path: "/short"
  # EN: short entries (method: 301/302/proxy)
  # 中文: short 入口（method: 301/302/proxy）
  entries:
    - name: "latepost"
      target: "/rsshub/latepost/4"
      method: "301"
    - name: "reddit-top"
      target: "https://example.com/rss?platform=reddit"
      method: "302"
    - name: "hn"
      target: "/rsshub/hn"
      method: "proxy"
    - name: "upvote-reddit"
      target: "/upvote/?platform=reddit"
      method: "proxy"
    - name: "cdt"
      target: "https://chinadigitaltimes.net/chinese/feed"
      method: "proxy"
    - name: "fearnation"
      target: "https://fearnation.club/rss/"
      method: "proxy"

# EN: routing defaults
# 中文: 路由默认配置
routing:
  # EN: default group name
  # 中文: 默认分组名
  default_group: "rsshub-public"

# EN: failover policies
# 中文: 故障转移策略
failover:
  # EN: retry policy (GET/HEAD only)
  # 中文: 重试策略（仅 GET/HEAD）
  retry:
    # EN: enable retry
    # 中文: 是否启用重试
    enabled: true
    # EN: max retries
    # 中文: 最大重试次数
    max_retries: 1
  # EN: passive eject policy
  # 中文: 被动剔除策略
  passive_eject:
    # EN: enable passive eject
    # 中文: 是否启用被动剔除
    enabled: true
    # EN: consecutive failures to eject
    # 中文: 连续失败触发剔除
    fail_threshold: 3
    # EN: base backoff in milliseconds
    # 中文: 初始剔除时长（毫秒）
    base_eject_ms: 10000
    # EN: max backoff in milliseconds
    # 中文: 最大剔除时长（毫秒）
    max_eject_ms: 60000

# EN: upstream groups
# 中文: 上游分组
# - allow/deny are prefix matches; deny overrides allow
# - allow/deny 为前缀匹配；deny 优先
# - use leading slash for prefixes
# - 前缀必须包含前导 "/"
# - group names must be unique
# - 分组名必须唯一
# - fallback_groups are tried in order
# - fallback_groups 按顺序回退
# - upstream access_key is used for code injection and healthcheck key
# - access_key 用于 code 注入与健康检查的 ?key=

groups:
  - name: "rsshub-public"
    # EN: backend type (rsshub or upvote)
    # 中文: 后端类型（rsshub 或 upvote）
    backend: "rsshub"
    # EN: strip prefix before proxying (optional)
    # 中文: 转发前剥离前缀（可选）
    strip_prefix: "/rsshub"
    # EN: higher priority wins when prefix length ties
    # 中文: 前缀长度相同则优先级更高者胜
    priority: 10
    # EN: allow prefixes
    # 中文: 允许前缀
    allow: ["/rsshub/"]
    # EN: deny prefixes
    # 中文: 拒绝前缀
    deny: []
    lb:
      # EN: wrr or hash
      # 中文: wrr 或 hash
      policy: "wrr"
    # EN: fallback groups
    # 中文: 回退分组
    fallback_groups: ["rsshub-backup"]
    health:
      active:
        # EN: enable active healthcheck
        # 中文: 是否启用主动健康检查
        enabled: true
        # EN: health path
        # 中文: 健康检查路径
        path: "/healthz"
        # EN: interval in milliseconds
        # 中文: 间隔（毫秒）
        interval_ms: 30000
        # EN: timeout in milliseconds
        # 中文: 超时（毫秒）
        timeout_ms: 10000
        # EN: consecutive failures to mark unhealthy
        # 中文: 连续失败次数
        retries: 3
    upstreams:
      - url: "http://rsshub-1:1200"
        # EN: load-balancing weight
        # 中文: 负载均衡权重
        weight: 3
        # EN: upstream access key
        # 中文: 上游访问密钥
        access_key: "UP1KEY"
      - url: "http://rsshub-2:1200"
        weight: 2
        access_key: "UP2KEY"

  - name: "rsshub-backup"
    backend: "rsshub"
    strip_prefix: "/rsshub"
    priority: 1
    allow: ["/rsshub/"]
    deny: []
    lb:
      policy: "hash"
    upstreams:
      - url: "http://rsshub-b1:1200"
        weight: 1
        access_key: "B1KEY"

  - name: "upvote"
    # EN: backend type (rsshub or upvote)
    # 中文: 后端类型（rsshub 或 upvote）
    backend: "upvote"
    # EN: strip prefix before proxying (optional)
    # 中文: 转发前剥离前缀（可选）
    strip_prefix: "/upvote"
    priority: 5
    allow: ["/upvote/"]
    deny: []
    lb:
      policy: "wrr"
    upstreams:
      - url: "http://upvote-rss:80"
        weight: 1
        # EN: access_key is optional for upvote
        # 中文: upvote 后端 access_key 可省略
